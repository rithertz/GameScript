name: GameScript CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-c++
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles"

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Run tests
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure
